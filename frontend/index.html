<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semaforo Playero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container"><span class="navbar-brand">🚦 Semáforo Playero - Cancún</span></div>
  </nav>

  <div class="container">
    <div class="row g-3 align-items-center mb-4">
      <div class="col-12 col-md-4"><input type="date" id="fecha" class="form-control"></div>
      <div class="col-12 col-md-5">
        <input type="range" id="hora" class="form-range" min="6" max="20" value="13">
        <small id="horaTxt"></small>
      </div>
      <div class="col-12 col-md-3 form-check form-switch">
        <input type="checkbox" id="festivo" class="form-check-input">
        <label class="form-check-label" for="festivo">Festivo</label>
      </div>
    </div>

    <div id="tarjetas" class="row g-3"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
